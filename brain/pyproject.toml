# Semáforo Inteligente - Brain Module
[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "semaforo-brain"
version = "0.1.0"
description = "Reinforcement-learning brain for the Semáforo Inteligente adaptive traffic-signal controller."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "BecasHub" },
]

dependencies = [
    "gymnasium>=1.0.0",
    "pettingzoo>=1.24.0",
    "stable-baselines3>=2.8.0",
    "sumo-rl>=1.4.5",
    "torch>=2.3.0",
    "onnx>=1.15.0",
    "onnxruntime>=1.17.0",
    "numpy>=1.26.0",
    "scipy>=1.12.0",
    "matplotlib>=3.8.0",
    "pyyaml>=6.0",
    "paho-mqtt>=2.0.0",
    "pandas>=2.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "black>=24.0",
    "ruff>=0.4.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.black]
line-length = 88
target-version = ["py310"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
