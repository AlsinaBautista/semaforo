# =============================================================================
# Semáforo Inteligente — CI / CD Test Pipeline
# =============================================================================
name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r brain/requirements.txt
          pip install pytest

      - name: Run Brain tests
        run: |
          cd brain && python -m pytest tests/ -v --tb=short

      - name: Run Coordinator tests
        run: |
          cd network/coordinator && python -m pytest tests/ -v --tb=short
