# =============================================================================
# Mosquitto Configuration — Semáforo Inteligente (Production, mTLS + ACL)
# =============================================================================

# -----------------------------------------------------------------------------
# Global authentication — MUST stay false in production.
# Mosquitto 2.x defaults to false, but we set it explicitly so no future
# per-listener override can silently re-open anonymous access.
# -----------------------------------------------------------------------------
allow_anonymous false

# Password file — used for clients that authenticate with username/password
# (e.g. Brain, Coordinator on the internal listener).
# Create with: mosquitto_passwd -c /mosquitto/config/passwd <username>
# Add users:   mosquitto_passwd /mosquitto/config/passwd <username>
# PLACEHOLDER — file must exist on disk before starting the broker.
password_file /mosquitto/config/passwd

# Access control list — enforces per-user topic permissions.
acl_file /mosquitto/config/mosquitto.acl

# -----------------------------------------------------------------------------
# Listener 1: MQTTS (TLS mutual auth) — production traffic
# -----------------------------------------------------------------------------
listener 8883
# mTLS: the client certificate CN becomes the MQTT username, matched by the ACL.
require_certificate true
use_identity_as_username true

cafile  /network/configs/certs/ca.crt
certfile /network/configs/certs/server.crt
keyfile  /network/configs/certs/server.key

# -----------------------------------------------------------------------------
# Listener 2: WebSockets (WSS) — dashboard, internal LAN only
# Bind to loopback so it is not reachable from outside the host.
# Remove or firewall this listener if the dashboard is not deployed.
# -----------------------------------------------------------------------------
listener 9001 127.0.0.1
protocol websockets

# NOTE: Port 1883 (plain MQTT) has been removed. All external clients must
# use port 8883 (mTLS). If a debug plaintext listener is needed during
# development, add it in a separate override file and never commit it.
