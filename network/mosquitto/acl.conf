# =============================================================================
# Semáforo Inteligente — Mosquitto ACL Configuration
# =============================================================================
# Access Control List for topic-level authorization.
#
# This file is used when 'acl_file' is set in mosquitto.conf.
# Currently not active in development (allow_anonymous true).
#
# Format:
#   user <username>
#   topic [read|write|readwrite|deny] <topic-pattern>
#
# Patterns:
#   %c — client ID
#   %u — username
#   #  — multi-level wildcard
#   +  — single-level wildcard
# =============================================================================

# -----------------------------------------------------------------------------
# Default access (deny all for unauthenticated users)
# -----------------------------------------------------------------------------
# topic deny #

# -----------------------------------------------------------------------------
# Edge devices — can publish telemetry and subscribe to commands
# -----------------------------------------------------------------------------
# user edge-device
# topic write semaforo/+/telemetry
# topic read  semaforo/+/command
# topic read  semaforo/+/timing/plan
# topic read  semaforo/+/sync/pulse

# -----------------------------------------------------------------------------
# Brain (RL Agent) — can publish commands and subscribe to telemetry
# -----------------------------------------------------------------------------
# user brain-agent
# topic read  semaforo/+/telemetry
# topic write semaforo/+/command

# -----------------------------------------------------------------------------
# Coordinator — full access to coordinate intersections
# -----------------------------------------------------------------------------
# user coordinator
# topic readwrite semaforo/#
# topic write     semaforo/+/timing/plan
# topic write     semaforo/+/sync/pulse
# topic read      semaforo/+/telemetry

# -----------------------------------------------------------------------------
# Dashboard — read-only access for monitoring
# -----------------------------------------------------------------------------
# user dashboard
# topic read semaforo/#

# -----------------------------------------------------------------------------
# Emergency services — high-priority override access
# -----------------------------------------------------------------------------
# user emergency
# topic write semaforo/+/emergency
# topic read  semaforo/+/telemetry

# -----------------------------------------------------------------------------
# System topics — restrict $SYS access
# -----------------------------------------------------------------------------
# topic read $SYS/#
