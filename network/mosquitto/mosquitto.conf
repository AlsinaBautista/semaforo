# =============================================================================
# Semáforo Inteligente — Mosquitto Configuration
# =============================================================================
# Development configuration for Eclipse Mosquitto 2.x MQTT broker.
# For production, enable authentication and TLS.
# =============================================================================

# -----------------------------------------------------------------------------
# General Settings
# -----------------------------------------------------------------------------
per_listener_settings false

# -----------------------------------------------------------------------------
# MQTT Listener (TCP)
# -----------------------------------------------------------------------------
listener 1883
protocol mqtt

# -----------------------------------------------------------------------------
# WebSocket Listener
# -----------------------------------------------------------------------------
listener 9001
protocol websockets

# -----------------------------------------------------------------------------
# Authentication
# -----------------------------------------------------------------------------
# WARNING: allow_anonymous is enabled for development only.
# For production, set to false and configure password_file or auth_plugin.
allow_anonymous true

# Uncomment for production:
# allow_anonymous false
# password_file /mosquitto/config/passwd
# acl_file /mosquitto/config/acl.conf

# -----------------------------------------------------------------------------
# Persistence
# -----------------------------------------------------------------------------
persistence true
persistence_location /mosquitto/data/
autosave_interval 60

# -----------------------------------------------------------------------------
# Logging
# -----------------------------------------------------------------------------
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
log_timestamp true
log_timestamp_format %Y-%m-%dT%H:%M:%S

# -----------------------------------------------------------------------------
# Message Settings
# -----------------------------------------------------------------------------
max_inflight_messages 200
max_queued_messages 1000
message_size_limit 0

# -----------------------------------------------------------------------------
# Connection Settings
# -----------------------------------------------------------------------------
max_connections -1
